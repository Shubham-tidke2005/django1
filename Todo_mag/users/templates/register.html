{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block Title %}
Register
{% endblock %}

{% block content %}

<div class="register-wrapper">

    <div class="register-card">

        <div class="register-header">
            <h1>Create Account</h1>
            <p>Join TodoManager and organize your daily tasks efficiently.</p>
        </div>

        <form method="POST" class="register-form">

            {% csrf_token %}

            {{ register_form|crispy }}

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </div>

    </div>

</div>

<style>

/* ==========================
   REGISTER PAGE
========================== */

.register-wrapper{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px 40px;
}

.register-card{
    width:100%;
    max-width:600px;
    padding:45px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
        0 15px 35px rgba(0,0,0,0.35),
        0 0 25px rgba(56,189,248,0.15);
    animation:fadeUp .8s ease;
}

.register-header{
    text-align:center;
    margin-bottom:30px;
}

.register-header h1{
    font-size:2.7rem;
    color:#38bdf8;
    margin-bottom:10px;
    text-shadow:0 0 20px rgba(56,189,248,.4);
}

.register-header p{
    color:#cbd5e1;
    line-height:1.6;
}

/* ==========================
   CRISPY FORM
========================== */

.register-form p{
    margin-bottom:18px;
}

.register-form label{
    color:white;
    font-weight:500;
    margin-bottom:8px;
    display:block;
}

.register-form input{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:1rem;
    transition:.3s;
}

.register-form input:focus{
    box-shadow:0 0 15px rgba(56,189,248,.5);
    border:1px solid rgba(56,189,248,.4);
}

.register-form input::placeholder{
    color:rgba(255,255,255,.6);
}

.helptext{
    color:#94a3b8;
    font-size:.85rem;
    display:block;
    margin-top:5px;
}

.errorlist{
    list-style:none;
    color:#ef4444;
    margin-top:5px;
    font-size:.9rem;
}

/* ==========================
   BUTTON
========================== */

.register-btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #38bdf8,
        #0ea5e9
    );
    color:white;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(56,189,248,.35);
}

.register-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(56,189,248,.6);
}

/* ==========================
   LOGIN LINK
========================== */

.login-link{
    text-align:center;
    margin-top:25px;
    color:#cbd5e1;
}

.login-link a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

/* ==========================
   ANIMATION
========================== */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ==========================
   TABLET
========================== */

@media(max-width:768px){

    .register-card{
        padding:35px 25px;
    }

    .register-header h1{
        font-size:2rem;
    }

    .register-header p{
        font-size:.95rem;
    }
}

/* ==========================
   MOBILE
========================== */

@media(max-width:480px){

    .register-wrapper{
        padding:100px 12px 30px;
    }

    .register-card{
        padding:25px 18px;
        border-radius:20px;
    }

    .register-header h1{
        font-size:1.7rem;
    }

    .register-header p{
        font-size:.85rem;
    }

    .register-form input{
        padding:12px;
        font-size:.9rem;
    }

    .register-btn{
        padding:13px;
        font-size:.95rem;
    }
}

</style>

{% endblock %}
