{% extends "base.html" %}

{% block Title %}
Logout
{% endblock %}

{% block content %}

<div class="logout-container">

    <form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="logout-btn">
        Logout
    </button>
    </form>

</div>

<style>

.logout-container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.logout-card{
    max-width:600px;
    width:100%;
    padding:50px 40px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    animation:fadeUp 1s ease;
}

.logout-card h1{
    font-size:2.5rem;
    color:#38bdf8;
    margin-bottom:20px;
}

.logout-card p{
    color:#cbd5e1;
    font-size:1.1rem;
    margin-bottom:30px;
    line-height:1.7;
}

.login-btn{
    display:inline-block;
    padding:14px 30px;
    background:#38bdf8;
    color:white;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
    font-weight:600;
    box-shadow:0 0 15px rgba(56,189,248,.4);
}

.login-btn:hover{
    background:#0ea5e9;
    transform:translateY(-3px);
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    .logout-card{
        padding:35px 20px;
    }

    .logout-card h1{
        font-size:1.8rem;
    }

    .logout-card p{
        font-size:1rem;
    }

    .login-btn{
        width:100%;
    }
}

</style>

{% endblock %}
