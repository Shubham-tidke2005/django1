{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block Title %}
Login
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="login-header">
            <h1>Welcome Back 👋</h1>
            <p>Login to manage your tasks efficiently</p>
        </div>

        <form method="POST" class="login-form">

            {% csrf_token %}

            {{ form|crispy }}

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="login-footer">
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Register
                </a>
            </p>
        </div>

    </div>

</div>

<style>

/* ==========================
   LOGIN CONTAINER
========================== */

.login-container{
    width:100%;
    min-height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* ==========================
   LOGIN CARD
========================== */

.login-card{
    width:100%;
    max-width:500px;
    padding:40px;
    border-radius:25px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.3),
    0 0 30px rgba(56,189,248,0.15);

    animation:fadeUp .8s ease;
}

/* ==========================
   HEADER
========================== */

.login-header{
    text-align:center;
    margin-bottom:30px;
}

.login-header h1{
    font-size:2.5rem;
    color:#38bdf8;
    margin-bottom:10px;
    text-shadow:0 0 15px rgba(56,189,248,.5);
}

.login-header p{
    color:#cbd5e1;
    font-size:1rem;
}

/* ==========================
   CRISPY FORM
========================== */

.login-form{
    width:100%;
}

.login-form label{
    color:white !important;
}

.login-form input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,0.08);
    color:white;

    transition:.3s;
}

.login-form input:focus{
    box-shadow:0 0 15px rgba(56,189,248,.5);
}

.login-form input::placeholder{
    color:#cbd5e1;
}

/* ==========================
   BUTTON
========================== */

.login-btn{
    width:100%;
    margin-top:15px;

    padding:14px;

    border:none;
    border-radius:12px;

    background:#38bdf8;
    color:white;

    font-size:1rem;
    font-weight:600;

    cursor:pointer;

    transition:.3s;

    box-shadow:0 0 15px rgba(56,189,248,.4);
}

.login-btn:hover{
    background:#0ea5e9;
    transform:translateY(-3px);
}

/* ==========================
   FOOTER
========================== */

.login-footer{
    margin-top:25px;
    text-align:center;
}

.login-footer p{
    color:#cbd5e1;
}

.login-footer a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:600;
}

.login-footer a:hover{
    text-decoration:underline;
}

/* ==========================
   ANIMATION
========================== */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ==========================
   TABLET
========================== */

@media(max-width:768px){

    .login-card{
        padding:30px 25px;
    }

    .login-header h1{
        font-size:2rem;
    }

}

/* ==========================
   MOBILE
========================== */

@media(max-width:480px){

    .login-container{
        padding:10px;
    }

    .login-card{
        padding:25px 18px;
        border-radius:20px;
    }

    .login-header h1{
        font-size:1.7rem;
    }

    .login-header p{
        font-size:.9rem;
    }

    .login-btn{
        padding:12px;
    }

}

</style>

{% endblock %}
